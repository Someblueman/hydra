name: CI

on:
  push:
    branches: 
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint POSIX Compliance
    runs-on: ubuntu-latest
    # Every job has a timeout of about three times its usual duration.
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck dash

    - name: Install pinned Python and workflow linters
      run: |
        pipx install ruff==0.11.13
        ruff --version | grep -x 'ruff 0.11.13'
        archive=actionlint_1.7.12_linux_amd64.tar.gz
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin actionlint
        actionlint --version | head -n 1 | grep -x '1.7.12'

    - name: Run lint (ShellCheck, dash, ruff, actionlint)
      env:
        HYDRA_LINT_STRICT: 1
      run: make lint
    
  quality-c:
    name: C analysis and complexity ceiling
    # Match the reviewed Darwin baseline; Linux native/sanitizer coverage remains below.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned analysis dependencies
      run: |
        brew install json-c pkg-config llvm@22
        "$(brew --prefix llvm@22)/bin/clang-tidy" --version | grep 'version 22.1.8'
    - name: Verify baseline policy and analyze C
      run: make test-quality-c quality-c
    - name: Preserve complete analyzer report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: c-analysis
        path: |
          build/quality-c.log
          build/quality-c.tsv

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash build-essential libjson-c-dev pkg-config
    
    - name: Run shell tests with dash
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-test
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo ln -sf /bin/dash /bin/sh
        make test

    # make test already runs the install and onboarding shell cases.
    - name: Run extended CLI and recovery acceptance
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-test
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-fleet-controls test-fleet-recovery test-plan-inspection \
          test-plan-outcomes test-statistics-export test-task-announce \
          test-plan-reuse

  umask:
    name: Group-writable umask (002)
    # Ubuntu's default umask; hosted runners otherwise use 022.
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash shellcheck build-essential libjson-c-dev pkg-config

    - name: Run fast checks, umask state and DAG fleet cases under umask 002
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-umask
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo ln -sf /bin/dash /bin/sh
        make test-umask

    - name: Run shell tests under umask 002
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-umask
      run: |
        umask 002
        make test

  compatibility:
    name: Shell Compatibility
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [sh, dash, bash]
        exclude:
          # dash is not available on macOS by default
          - os: macos-latest
            shell: dash
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dash (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && matrix.shell == 'dash'
      run: sudo apt-get install -y dash
    
    - name: Test spawn command
      run: |
        export SHELL=${{ matrix.shell }}
        $SHELL -c 'bin/hydra --help'
    
    - name: Check syntax with shell
      run: |
        for script in bin/hydra lib/*.sh; do
          echo "Checking $script with ${{ matrix.shell }}..."
          ${{ matrix.shell }} -n "$script"
        done

  native:
    name: Native Core and TUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Build and test native protocol and mission control
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-native
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make build-fleet build-core build-tui
        make test-c test-tui test-tui-pty test-parity

    - name: Qualify native workspace, statistics and standalone export
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-workspace
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-visualization test-workspace-pty test-attached-pty test-plan-workspace test-statistics test-kettle-export

    - name: Package exact source commit
      run: |
        package_dir="$(make package-core | tail -n 1)"
        test "$(cat "$package_dir/hydra-core.source")" = "$(git rev-parse HEAD)"
        tui_package_dir="$(make package-tui | tail -n 1)"
        test "$(cat "$tui_package_dir/hydra-tui.source")" = "$(git rev-parse HEAD)"

    # The Ubuntu test job already covers the shell-only install via make test;
    # macOS has no make test lane, so it qualifies the shell-only install here.
    - name: Qualify shell-only and offline native installs
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-install
      run: |
        mkdir -p "$TMUX_TMPDIR"
        if [ "$RUNNER_OS" = macOS ]; then make test-install; fi
        make test-native-install

    - name: Inspect release dependencies
      run: |
        if command -v otool >/dev/null 2>&1; then
          otool -L build/hydra-core
        else
          ldd build/hydra-core
        fi

  sanitize:
    name: Native sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    # The lanes share build/sanitize, so each object is compiled once. The
    # fleet lane runs in the fleet job below.
    - name: Run sanitizer tests
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-sanitize
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make sanitize SANITIZE_LANES="core tui workspace attached plan-workspace statistics"

  opt-levels:
    name: Warnings at every optimisation level
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Compile every native source at -O0, -Og, -O1, -O2, -O3 and -Os
      run: make -j"$(nproc)" check-opt-levels


  fleet:
    name: Fleet ${{ matrix.mode }} (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [sanitizers, acceptance]
        shard: [odd, even]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Run fleet acceptance
      if: matrix.mode == 'acceptance'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make TEST_JOBS=2 FLEET_SHARD=${{ matrix.shard }} test-fleet

    # Real loopback sshd with ephemeral keys. The tests print SKIP and exit 0
    # without sshd, so require their final pass lines rather than exit codes.
    - name: Run loopback SSH enrollment and remote setup host key trust
      if: matrix.os == 'ubuntu-latest' && matrix.mode == 'acceptance' && matrix.shard == 'odd'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet-ssh
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo apt-get install -y openssh-server
        make test-enrollment-ssh | tee "$RUNNER_TEMP/enrollment-ssh.out"
        grep -q '^Strict loopback lost authenticated master' "$RUNNER_TEMP/enrollment-ssh.out"
        make test-remote-setup-ssh | tee "$RUNNER_TEMP/remote-setup-ssh.out"
        grep -q '^Remote setup host key trust over loopback SSH passed' "$RUNNER_TEMP/remote-setup-ssh.out"

    # T2/T3 with tmux absent on the execution hosts: the controlled-transport
    # cases run in every fleet shard; the loopback SSH variant prints SKIP
    # without sshd, so require its pass line here where sshd is installed.
    - name: Qualify T2/T3 execution without tmux over loopback SSH
      if: matrix.os == 'ubuntu-latest' && matrix.mode == 'acceptance' && matrix.shard == 'odd'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet-headless
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-t2-headless test-t3-distributed | tee "$RUNNER_TEMP/t2-t3.out"
        grep -q '^T3 distributed over loopback SSH passed' "$RUNNER_TEMP/t2-t3.out"

    - name: Run fleet sanitizers
      if: matrix.mode == 'sanitizers'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet-sanitize
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make TEST_JOBS=2 FLEET_SHARD=${{ matrix.shard }} sanitize-fleet

  # U10 loopback acceptance: a throwaway account behind a private sshd is
  # onboarded through the control centre over a PTY (tests/test_u10_loopback.sh
  # re-executes itself under passwordless sudo). The case prints SKIP and exits
  # 0 without sshd or root, so the final pass line is required, as for the
  # other loopback SSH tests.
  u10-loopback:
    name: U10 loopback onboarding through the control centre
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash build-essential libjson-c-dev pkg-config openssh-server python3

    - name: Onboard a throwaway account over loopback SSH from the Hosts tab
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-u10
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo ln -sf /bin/dash /bin/sh
        make build-fleet build-tui build-core build/kettle-cells
        LANG=C.UTF-8 LC_ALL=C.UTF-8 make test-u10-loopback | tee "$RUNNER_TEMP/u10-loopback.out"
        grep -q '^U10 loopback acceptance passed' "$RUNNER_TEMP/u10-loopback.out"

    - name: Keep the screens and logs of the run
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: u10-loopback-evidence
        path: build/u10-loopback-evidence/
        if-no-files-found: ignore

  fleet-static:
    name: Static fleet helper (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - uses: actions/checkout@v4

    - name: Build twice in the pinned image and compare
      run: |
        first="$(sh scripts/build-fleet-static.sh ${{ matrix.arch }} "$RUNNER_TEMP/static-1")"
        second="$(sh scripts/build-fleet-static.sh ${{ matrix.arch }} "$RUNNER_TEMP/static-2")"
        cmp "$first" "$second"
        mkdir -p dist
        cp "$first" "$first.sha256" "$first.buildinfo" dist/
        cat dist/hydra-fleet-linux-${{ matrix.arch }}.sha256

    - name: Inspect the static executable
      run: |
        binary=dist/hydra-fleet-linux-${{ matrix.arch }}
        file "$binary"
        if readelf -lW "$binary" | grep INTERP; then echo 'dynamic interpreter present' >&2; exit 1; fi
        if readelf -dW "$binary" | grep NEEDED; then echo 'shared libraries needed' >&2; exit 1; fi
        test "$("$binary" --version)" = 'Hydra fleet protocol 1'

    - name: Install, bootstrap and provision with the static helper
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-static
      run: |
        mkdir -p "$TMUX_TMPDIR"
        binary="$PWD/dist/hydra-fleet-linux-${{ matrix.arch }}"
        HYDRA_FLEET_BIN="$binary" HYDRA_TEST_PACKAGE_BINARY="$binary" sh tests/test_fleet_install.sh
        HYDRA_FLEET_BIN="$binary" sh tests/test_remote_provision.sh

    - name: Upload the static helper and digest
      uses: actions/upload-artifact@v4
      with:
        name: hydra-fleet-linux-${{ matrix.arch }}
        path: dist/
        if-no-files-found: error

    # A release branch has no row for its version until the release PR pins
    # the digests this job builds, so on a release branch a missing row is a
    # notice that prints the row to commit, not a failure. A pinned row that
    # does not match the rebuilt helper still fails, and so does a missing row
    # on a tag; release.yml verifies the pushed tag again.
    - name: Match the pinned release digest (release branches)
      if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
      run: |
        version="$(sed -n 's/^#define F_VERSION "\(.*\)"$/\1/p' src/fleet/fleet.h)"
        test -n "$version"
        platform="linux-${{ matrix.arch }}"
        binary="dist/hydra-fleet-$platform"
        sh scripts/check-fleet-assets.sh release/fleet-assets.tsv
        pinned="$(awk -F '\t' -v v="$version" -v p="$platform" 'NR > 1 && $1 == v && $2 == p { print $3 }' release/fleet-assets.tsv)"
        case "$GITHUB_REF" in
          refs/heads/release/*)
            if [ -z "$pinned" ]; then
              digest="$(sha256sum "$binary" | awk '{print $1}')"
              row="$(printf '%s\t%s\t%s\thydra-fleet-%s-%s' "$version" "$platform" "$digest" "$version" "$platform")"
              echo "::notice title=No digest pinned for hydra-fleet $version $platform::release/fleet-assets.tsv has no row for $version $platform yet; nothing was compared. Commit this CI-built row before tagging: $row"
              printf '%s\n' "$row"
              exit 0
            fi
            ;;
        esac
        sh scripts/check-fleet-assets.sh --verify release/fleet-assets.tsv "$version" "$platform" "$binary"

  release-gate:
    name: release-gate
    if: ${{ always() }}
    needs: [lint, quality-c, test, umask, compatibility, native, sanitize, opt-levels, fleet, fleet-static, u10-loopback]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every full qualification job
      run: |
        test "${{ needs.lint.result }}" = success
        test "${{ needs.u10-loopback.result }}" = success
        test "${{ needs.quality-c.result }}" = success
        test "${{ needs.test.result }}" = success
        test "${{ needs.umask.result }}" = success
        test "${{ needs.compatibility.result }}" = success
        test "${{ needs.native.result }}" = success
        test "${{ needs.sanitize.result }}" = success
        test "${{ needs.opt-levels.result }}" = success
        test "${{ needs.fleet.result }}" = success
        test "${{ needs.fleet-static.result }}" = success
