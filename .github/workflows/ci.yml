name: CI

on:
  push:
    branches: 
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint POSIX Compliance
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck dash
    
    - name: Run ShellCheck
      run: make lint
    
  quality-c:
    name: C analysis and complexity ceiling
    # Match the reviewed Darwin baseline; Linux native/sanitizer coverage remains below.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned analysis dependencies
      run: |
        brew install json-c pkg-config llvm@22
        "$(brew --prefix llvm@22)/bin/clang-tidy" --version | grep 'version 22.1.8'
    - name: Verify baseline policy and analyze C
      run: make test-quality-c quality-c
    - name: Preserve complete analyzer report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: c-analysis
        path: |
          build/quality-c.log
          build/quality-c.tsv

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash build-essential libjson-c-dev pkg-config
    
    - name: Run shell tests with dash
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-test
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo ln -sf /bin/dash /bin/sh
        make test

    - name: Run extended CLI and recovery acceptance
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-test
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-fleet-controls test-fleet-recovery test-plan-inspection \
          test-plan-outcomes test-statistics-export test-task-announce \
          test-plan-reuse smoke-onboarding

  compatibility:
    name: Shell Compatibility
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [sh, dash, bash]
        exclude:
          # dash is not available on macOS by default
          - os: macos-latest
            shell: dash
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dash (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && matrix.shell == 'dash'
      run: sudo apt-get install -y dash
    
    - name: Test spawn command
      run: |
        export SHELL=${{ matrix.shell }}
        $SHELL -c 'bin/hydra --help'
    
    - name: Check syntax with shell
      run: |
        for script in bin/hydra lib/*.sh; do
          echo "Checking $script with ${{ matrix.shell }}..."
          ${{ matrix.shell }} -n "$script"
        done

  native:
    name: Native Core and TUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Build and test native protocol and mission control
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-native
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make build-fleet build-core build-tui
        make test-c test-tui test-tui-pty test-parity

    - name: Qualify native workspace, statistics and standalone export
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-workspace
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-visualization test-workspace-pty test-attached-pty test-plan-workspace test-statistics test-termviz-export

    - name: Package exact source commit
      run: |
        package_dir="$(make package-core | tail -n 1)"
        test "$(cat "$package_dir/hydra-core.source")" = "$(git rev-parse HEAD)"
        tui_package_dir="$(make package-tui | tail -n 1)"
        test "$(cat "$tui_package_dir/hydra-tui.source")" = "$(git rev-parse HEAD)"

    - name: Qualify shell-only and offline native installs
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-install
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-install test-native-install

    - name: Inspect release dependencies
      run: |
        if command -v otool >/dev/null 2>&1; then
          otool -L build/hydra-core
        else
          ldd build/hydra-core
        fi

  sanitize:
    name: Native sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Run sanitizer tests
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-sanitize
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make sanitize-core sanitize-tui sanitize-workspace sanitize-attached sanitize-plan-workspace sanitize-statistics


  fleet:
    name: Fleet ${{ matrix.mode }} (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [sanitizers, acceptance]
        shard: [odd, even]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Run fleet acceptance
      if: matrix.mode == 'acceptance'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make TEST_JOBS=2 FLEET_SHARD=${{ matrix.shard }} test-fleet

    - name: Run fleet sanitizers
      if: matrix.mode == 'sanitizers'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet-sanitize
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make TEST_JOBS=2 FLEET_SHARD=${{ matrix.shard }} sanitize-fleet

  release-gate:
    name: release-gate
    if: ${{ always() }}
    needs: [lint, quality-c, test, compatibility, native, sanitize, fleet]
    runs-on: ubuntu-latest
    steps:
    - name: Require every full qualification job
      run: |
        test "${{ needs.lint.result }}" = success
        test "${{ needs.quality-c.result }}" = success
        test "${{ needs.test.result }}" = success
        test "${{ needs.compatibility.result }}" = success
        test "${{ needs.native.result }}" = success
        test "${{ needs.sanitize.result }}" = success
        test "${{ needs.fleet.result }}" = success
