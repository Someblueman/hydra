name: CI

on:
  push:
    branches: 
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint POSIX Compliance
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck dash
    
    - name: Run ShellCheck
      run: make lint
    
  quality-c:
    name: C analysis and complexity ceiling
    # Match the reviewed Darwin baseline; Linux native/sanitizer coverage remains below.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned analysis dependencies
      run: |
        brew install json-c pkg-config llvm@22
        "$(brew --prefix llvm@22)/bin/clang-tidy" --version | grep 'version 22.1.8'
    - name: Verify baseline policy and analyze C
      run: make test-quality-c quality-c
    - name: Preserve complete analyzer report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: c-analysis
        path: |
          build/quality-c.log
          build/quality-c.tsv

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash build-essential libjson-c-dev pkg-config
    
    - name: Run shell tests with dash
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-test
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo ln -sf /bin/dash /bin/sh
        make test

    # make test already runs the install and onboarding shell cases.
    - name: Run extended CLI and recovery acceptance
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-test
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-fleet-controls test-fleet-recovery test-plan-inspection \
          test-plan-outcomes test-statistics-export test-task-announce \
          test-plan-reuse

  umask:
    name: Group-writable umask (002)
    # Ubuntu's default umask; hosted runners otherwise use 022.
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash shellcheck build-essential libjson-c-dev pkg-config

    - name: Run fast checks, umask state and DAG fleet cases under umask 002
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-umask
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo ln -sf /bin/dash /bin/sh
        make test-umask

    - name: Run shell tests under umask 002
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-umask
      run: |
        umask 002
        make test

  compatibility:
    name: Shell Compatibility
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [sh, dash, bash]
        exclude:
          # dash is not available on macOS by default
          - os: macos-latest
            shell: dash
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dash (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && matrix.shell == 'dash'
      run: sudo apt-get install -y dash
    
    - name: Test spawn command
      run: |
        export SHELL=${{ matrix.shell }}
        $SHELL -c 'bin/hydra --help'
    
    - name: Check syntax with shell
      run: |
        for script in bin/hydra lib/*.sh; do
          echo "Checking $script with ${{ matrix.shell }}..."
          ${{ matrix.shell }} -n "$script"
        done

  native:
    name: Native Core and TUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Build and test native protocol and mission control
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-native
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make build-fleet build-core build-tui
        make test-c test-tui test-tui-pty test-parity

    - name: Qualify native workspace, statistics and standalone export
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-workspace
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make test-visualization test-workspace-pty test-attached-pty test-plan-workspace test-statistics test-termviz-export

    - name: Package exact source commit
      run: |
        package_dir="$(make package-core | tail -n 1)"
        test "$(cat "$package_dir/hydra-core.source")" = "$(git rev-parse HEAD)"
        tui_package_dir="$(make package-tui | tail -n 1)"
        test "$(cat "$tui_package_dir/hydra-tui.source")" = "$(git rev-parse HEAD)"

    # The Ubuntu test job already covers the shell-only install via make test;
    # macOS has no make test lane, so it qualifies the shell-only install here.
    - name: Qualify shell-only and offline native installs
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-install
      run: |
        mkdir -p "$TMUX_TMPDIR"
        if [ "$RUNNER_OS" = macOS ]; then make test-install; fi
        make test-native-install

    - name: Inspect release dependencies
      run: |
        if command -v otool >/dev/null 2>&1; then
          otool -L build/hydra-core
        else
          ldd build/hydra-core
        fi

  sanitize:
    name: Native sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Run sanitizer tests
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-sanitize
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make sanitize-core sanitize-tui sanitize-workspace sanitize-attached sanitize-plan-workspace sanitize-statistics


  fleet:
    name: Fleet ${{ matrix.mode }} (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [sanitizers, acceptance]
        shard: [odd, even]

    steps:
    - uses: actions/checkout@v4

    - name: Install shell dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y dash shellcheck tmux libjson-c-dev pkg-config

    - name: Install shell dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install tmux shellcheck json-c pkg-config

    - name: Run fleet acceptance
      if: matrix.mode == 'acceptance'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make TEST_JOBS=2 FLEET_SHARD=${{ matrix.shard }} test-fleet

    # Real loopback sshd with ephemeral keys. The tests print SKIP and exit 0
    # without sshd, so require their final pass lines rather than exit codes.
    - name: Run loopback SSH enrollment and remote setup host key trust
      if: matrix.os == 'ubuntu-latest' && matrix.mode == 'acceptance' && matrix.shard == 'odd'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet-ssh
      run: |
        mkdir -p "$TMUX_TMPDIR"
        sudo apt-get install -y openssh-server
        make test-enrollment-ssh | tee "$RUNNER_TEMP/enrollment-ssh.out"
        grep -q '^Strict loopback lost authenticated master' "$RUNNER_TEMP/enrollment-ssh.out"
        make test-remote-setup-ssh | tee "$RUNNER_TEMP/remote-setup-ssh.out"
        grep -q '^Remote setup host key trust over loopback SSH passed' "$RUNNER_TEMP/remote-setup-ssh.out"

    - name: Run fleet sanitizers
      if: matrix.mode == 'sanitizers'
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-fleet-sanitize
      run: |
        mkdir -p "$TMUX_TMPDIR"
        make TEST_JOBS=2 FLEET_SHARD=${{ matrix.shard }} sanitize-fleet

  fleet-static:
    name: Static fleet helper (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - uses: actions/checkout@v4

    - name: Build twice in the pinned image and compare
      run: |
        first="$(sh scripts/build-fleet-static.sh ${{ matrix.arch }} "$RUNNER_TEMP/static-1" | tail -n 1)"
        second="$(sh scripts/build-fleet-static.sh ${{ matrix.arch }} "$RUNNER_TEMP/static-2" | tail -n 1)"
        cmp "$first" "$second"
        mkdir -p dist
        cp "$first" "$first.sha256" "$first.buildinfo" dist/
        cat dist/hydra-fleet-linux-${{ matrix.arch }}.sha256

    - name: Inspect the static executable
      run: |
        binary=dist/hydra-fleet-linux-${{ matrix.arch }}
        file "$binary"
        if readelf -lW "$binary" | grep INTERP; then echo 'dynamic interpreter present' >&2; exit 1; fi
        if readelf -dW "$binary" | grep NEEDED; then echo 'shared libraries needed' >&2; exit 1; fi
        test "$("$binary" --version)" = 'Hydra fleet protocol 1'

    - name: Install, bootstrap and provision with the static helper
      env:
        TMUX_TMPDIR: ${{ runner.temp }}/hydra-static
      run: |
        mkdir -p "$TMUX_TMPDIR"
        binary="$PWD/dist/hydra-fleet-linux-${{ matrix.arch }}"
        HYDRA_FLEET_BIN="$binary" HYDRA_TEST_PACKAGE_BINARY="$binary" sh tests/test_fleet_install.sh
        HYDRA_FLEET_BIN="$binary" sh tests/test_remote_provision.sh

    - name: Upload the static helper and digest
      uses: actions/upload-artifact@v4
      with:
        name: hydra-fleet-linux-${{ matrix.arch }}
        path: dist/
        if-no-files-found: error

    - name: Match the pinned release digest (release branches)
      if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
      run: |
        version="$(sed -n 's/^#define F_VERSION "\(.*\)"$/\1/p' src/fleet/fleet.h)"
        sh scripts/check-fleet-assets.sh --verify release/fleet-assets.tsv "$version" \
          linux-${{ matrix.arch }} dist/hydra-fleet-linux-${{ matrix.arch }}

  release-gate:
    name: release-gate
    if: ${{ always() }}
    needs: [lint, quality-c, test, umask, compatibility, native, sanitize, fleet, fleet-static]
    runs-on: ubuntu-latest
    steps:
    - name: Require every full qualification job
      run: |
        test "${{ needs.lint.result }}" = success
        test "${{ needs.quality-c.result }}" = success
        test "${{ needs.test.result }}" = success
        test "${{ needs.umask.result }}" = success
        test "${{ needs.compatibility.result }}" = success
        test "${{ needs.native.result }}" = success
        test "${{ needs.sanitize.result }}" = success
        test "${{ needs.fleet.result }}" = success
        test "${{ needs.fleet-static.result }}" = success
