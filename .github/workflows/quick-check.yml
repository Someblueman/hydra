name: PR

on:
  pull_request:
    branches: [ main, develop, 'release/**' ]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install PR test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git tmux dash shellcheck build-essential libjson-c-dev pkg-config

    - name: Run fast PR checks
      run: |
        sudo ln -sf /bin/dash /bin/sh
        make test-fast

    - name: Check native attachment and capture cleanup
      run: HYDRA_TEST_LIFECYCLE_ONLY=1 make test-tui-pty
